name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bridge:
    name: Go bridge
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: whatsapp-bridge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: whatsapp-bridge/go.mod
          cache-dependency-path: whatsapp-bridge/go.sum
      - name: Vet
        run: go vet ./...
      - name: Test (encrypted databases)
        run: go test -race -count=1 ./...
      - name: Test (plain SQLite)
        run: go test -race -count=1 ./...
        env:
          WHATSAPP_DB_ENCRYPTION: "off"

  server:
    name: Python MCP server
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: whatsapp-mcp-server
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: whatsapp-mcp-server/uv.lock
      - name: Install
        run: uv sync --locked
      - name: Test
        run: uv run pytest -q
