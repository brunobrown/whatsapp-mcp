[project]
name = "whatsapp-mcp-server"
version = "0.5.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.1",
    "mcp[cli]>=2.3.0",
    "requests>=2.32.3",
    "sqlcipher3-binary>=0.5.4",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
# The web interface (python -m ui). The server itself does not need Flet.
ui = [
    "flet>=1.1,<1.2",
    "flet-web>=1.1,<1.2",
    "flet-notifications>=1.1,<1.2",
]
# Drives the interface in a browser (tests/e2e, WHATSAPP_UI_E2E=1).
ui-e2e = [
    "playwright>=1.49",
]
